name: Tests & Report

# Manuell startbar über den "Run workflow"-Button (Actions-Tab).
on:
  workflow_dispatch:

# Rechte für das GitHub-Pages-Deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert parallele Pages-Deployments, die sich gegenseitig überschreiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run API + E2E tests
    runs-on: ubuntu-latest
    # outcome der beiden Test-Steps für das spätere Gate weiterreichen.
    outputs:
      api: ${{ steps.api.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@v4

      # --- System Under Test hochfahren (API :3000 + Frontend :5173) ---
      - name: Start SUT (docker compose)
        working-directory: sut
        run: docker compose up --build -d

      - name: Wait for SUT
        working-directory: sut
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/todos || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173 || true)
            if [ "$api" != "000" ] && [ "$web" != "000" ]; then
              echo "SUT up (api=$api web=$web)"; exit 0
            fi
            echo "waiting... api=$api web=$web"; sleep 3
          done
          echo "SUT did not come up"; docker compose logs; exit 1

      # --- Toolchains ---
      - uses: actions/setup-node@v4
        with:
          node-version: 24     # cucumber@13 verlangt 22/24/>=26 (siehe e2e-tests/.nvmrc)

      - uses: actions/setup-java@v4     # Serenity-BDD-Report-CLI ist JVM-basiert
        with:
          distribution: temurin
          java-version: 17

      # --- API-Tests (Newman -> HTML + JUnit) ---
      - name: API tests (Newman)
        id: api
        continue-on-error: true         # Report soll auch bei Fehlern deployt werden
        working-directory: api-tests
        run: |
          npx -y -p newman -p newman-reporter-htmlextra newman run \
            road-overview.postman_collection.json \
            -e road-overview.postman_environment.json \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export report/index.html \
            --reporter-junit-export report/junit.xml

      # --- E2E-Tests (Serenity/JS + Playwright + Cucumber) ---
      - name: Install e2e deps
        working-directory: e2e-tests
        run: npm ci

      - name: Cache Serenity BDD CLI jar
        working-directory: e2e-tests
        run: npm run serenity:update    # lädt/cached die serenity-bdd CLI (JVM)

      - name: Install Playwright browsers
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Serenity/Cucumber)
        id: e2e
        continue-on-error: true
        working-directory: e2e-tests
        run: npm test                   # clean -> cucumber -> serenity HTML-Report

      # --- Reports zu einer Pages-Site zusammenbauen ---
      - name: Assemble report site
        if: always()
        run: |
          mkdir -p public/e2e public/api
          cp -r e2e-tests/target/site/serenity/. public/e2e/ 2>/dev/null || echo "no serenity report"
          cp -r api-tests/report/. public/api/           2>/dev/null || echo "no api report"
          cat > public/index.html <<'EOF'
          <!doctype html><html lang="de"><meta charset="utf-8">
          <title>Road Overview – Test Reports</title>
          <h1>Road Overview – Test Reports</h1>
          <ul>
            <li><a href="./e2e/index.html">E2E (Serenity/JS)</a></li>
            <li><a href="./api/index.html">API (Newman htmlextra)</a></li>
          </ul>
          EOF

      - name: Upload logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public

  # --- Report auf GitHub Pages deployen ---
  deploy:
    name: Deploy report to Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # --- Gate: Workflow rot markieren, wenn eine Suite fehlschlug ---
  gate:
    name: Test result gate
    needs: [test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any suite failed
        run: |
          echo "API: ${{ needs.test.outputs.api }}   E2E: ${{ needs.test.outputs.e2e }}"
          [ "${{ needs.test.outputs.api }}" = "success" ] && [ "${{ needs.test.outputs.e2e }}" = "success" ]
